server {
    server_name yetemare.online www.yetemare.online;

    location / {
        proxy_pass http://localhost:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yetemare.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yetemare.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.yetemare.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = yetemare.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name yetemare.online www.yetemare.online;
    return 404; # managed by Certbot